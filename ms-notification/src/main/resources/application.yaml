server:
  port: 8086

spring:
  application:
    name: ms-notification
  
  config:
    import: optional:classpath:application-custom.properties

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    url: "${DB_URL}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 180000

  sql:
    init:
      mode: never
      data-locations: 

  jpa:
    defer-datasource-initialization: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true
        "[default_schema]": bd_notificaciones
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    default-schema: bd_notificaciones
    schemas: bd_notificaciones
    locations: classpath:db/migration
    validate-on-migrate: false

logging:
  file:
    name: logs/ms-notification.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.hibernate: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    cl.aduana.ms_notification: DEBUG
    cl.aduana.common: DEBUG