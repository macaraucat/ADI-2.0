server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ms-login
          uri: lb://MS-LOGIN
          predicates:
            - Path=/api/v1/login/**
        - id: ms-vehicle
          uri: lb://MS-VEHICLE
          predicates:
            - Path=/api/v1/vehiculos/**,/api/v1/admisiones/**,/api/v1/conductores/**
        - id: ms-report
          uri: lb://MS-REPORT
          predicates:
            - Path=/api/v1/reportes/**
        - id: ms-travel
          uri: lb://MS-TRAVEL
          predicates:
            - Path=/api/v1/tramites/**
        - id: ms-notification
          uri: lb://MS-NOTIFICATION
          predicates:
            - Path=/api/v1/notificaciones/**
        - id: ms-risk
          uri: lb://MS-RISK
          predicates:
            - Path=/api/v1/alerta/**,/api/v1/inspeccion/**,/api/v1/riesgo/**,/api/v1/patentes-infraccion/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/