server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ms-login
          uri: lb://MS-LOGIN
          predicates:
            - Path=/api/v1/login/**
        - id: ms-vehicle
          uri: lb://MS-VEHICLE
          predicates:
            - Path=/api/v1/vehiculos/**,/api/v1/admisiones/**,/api/v1/conductores/**  
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/