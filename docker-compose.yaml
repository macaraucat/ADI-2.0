services:
  eureka-server:
    build: ./eureka
    container_name: eureka
    ports: ["8761:8761"]
    environment:
            - SERVER_PORT=8761
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: gateway
    ports: ["8080:8080"]
    depends_on: [eureka-server]
    environment:
            - SERVER_PORT=8080
            - SPRING_APPLICATION_NAME=api-gateway
            - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
    restart: on-failure

  ms-login:
    build: ./ms-login
    container_name: login
    ports: ["8081:8081"]
    depends_on: [eureka-server]
    environment:
            - SERVER_PORT=8081
            - SPRING_APPLICATION_NAME=ms-usuario
            - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
            - SPRING_DATASOURCE_URL=${DB_URL}
            - SPRING_DATASOURCE_USERNAME=${DB_USER}
            - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
            - SPRING_JPA_HIBERNATE_DDL_AUTO=update
            - SPRING_FLYWAY_ENABLED=false
    restart: on-failure

  # copia el mismo bloque para los demás, solo cambia puerto y nombre
  ms-vehicle:
    build: ./ms-vehicle
    ports: ["8082:8082"]
    environment:
            - SERVER_PORT=8082
            - SPRING_APPLICATION_NAME=ms-vehiculo
            - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
            - SPRING_DATASOURCE_URL=${DB_URL}
            - SPRING_DATASOURCE_USERNAME=${DB_USER}
            - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
            - SPRING_JPA_HIBERNATE_DDL_AUTO=update
            - SPRING_FLYWAY_ENABLED=false

  ms-travel:
    build: ./ms-travel
    ports: ["8083:8083"]
    environment:
            - SERVER_PORT=8083
            - SPRING_APPLICATION_NAME=ms-travel
            - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
            - SPRING_DATASOURCE_URL=${DB_URL}
            - SPRING_DATASOURCE_USERNAME=${DB_USER}
            - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
            - SPRING_JPA_HIBERNATE_DDL_AUTO=update
            - SPRING_FLYWAY_ENABLED=false
            - APP_MODO_EMERGENCIA=false

  ms-risk:
    build: ./ms-risk
    ports: ["8084:8084"]
    environment:
            - SERVER_PORT=8084
            - SPRING_APPLICATION_NAME=ms-riesgo
            - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
            - SPRING_DATASOURCE_URL=${DB_URL}
            - SPRING_DATASOURCE_USERNAME=${DB_USER}
            - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
            - SPRING_JPA_HIBERNATE_DDL_AUTO=update
            - SPRING_FLYWAY_ENABLED=false

  ms-report:
    build: ./ms-report
    ports: ["8085:8085"]
    environment:
            - SERVER_PORT=8085
            - SPRING_APPLICATION_NAME=ms-report
            - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
            - SPRING_DATASOURCE_URL=${DB_URL}
            - SPRING_DATASOURCE_USERNAME=${DB_USER}
            - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
            - SPRING_JPA_HIBERNATE_DDL_AUTO=update
            - SPRING_FLYWAY_ENABLED=false

  ms-notification:
    build: ./ms-notification
    ports: ["8086:8086"]
    environment:
            - SERVER_PORT=8086
            - SPRING_APPLICATION_NAME=ms-notificacion
            - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
            - SPRING_DATASOURCE_URL=${DB_URL}
            - SPRING_DATASOURCE_USERNAME=${DB_USER}
            - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
            - SPRING_JPA_HIBERNATE_DDL_AUTO=update
            - SPRING_FLYWAY_ENABLED=false