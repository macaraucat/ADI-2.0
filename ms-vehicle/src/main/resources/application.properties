spring.application.name=ms-vehicle
server.port=8082

spring.config.import=optional:classpath:application-custom.properties

logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO

spring.output.ansi.enabled=ALWAYS

spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require&ApplicationName=ms-vehicle
spring.datasource.username=postgres.sgauqlruohmhfvpezfpx
spring.datasource.password=AduanaPro123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=180000

spring.sql.init.mode=never
spring.sql.init.data-locations=

spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=bd_vehiculos
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.default-schema=bd_vehiculos
spring.flyway.schemas=bd_vehiculos
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# Logging
logging.level.cl.aduana.ms_vehicle=DEBUG
logging.level.cl.aduana.common=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=INFO
logging.file.name=logs/ms-vehicle.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Doc - Swagger
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.default-flat-param-object=false